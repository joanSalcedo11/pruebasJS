<!DOCTYPE html>
<html>
<head>
    <title>Temporizador</title>
</head>
<body>
    <div id="mensaje"></div>

    <script>
        setInterval(function() {
          for(var n=1,n=40,n++){
            document.getElementById("mensaje").textContent = "hola mundo"+n;
          }
            
        }, 15000);
    </script>
</body>
</html>
